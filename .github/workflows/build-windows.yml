name: Build Windows EXE

on:
  push:
    tags: ["v*"]       # pushing a tag such as v2.0 builds the exe and publishes a release
  workflow_dispatch:   # manual run from the Actions tab (exe kept as a run artifact)

permissions:
  contents: write      # needed to create the release

jobs:
  build:
    runs-on: windows-latest   # real Windows Server runner (Win7 compat via Python 3.8)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"   # last version supporting Windows 7

      - name: Install dependencies
        working-directory: Win
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 requests pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_idm_core.py tests/test_idm_win.py tests/test_speed_core.py tests/test_win_ui.py

      - name: Copy assets
        run: |
          copy "idm-quota-monitor\contents\images\logo.png" "Win\logo.png"

      - name: Build EXE
        working-directory: Win
        run: |
          pyinstaller idm_monitor.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDMQuotaMonitor-Windows
          path: Win/dist/IDMQuotaMonitor.exe
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Win/dist/IDMQuotaMonitor.exe
          generate_release_notes: true
