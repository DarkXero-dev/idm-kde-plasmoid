name: Build Windows EXE

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
    tags: ["v*"]       # a tag such as v2.0 publishes a release of its own
  workflow_dispatch:   # manual run from the Actions tab

permissions:
  contents: write      # needed to publish releases

jobs:
  build:
    runs-on: windows-latest   # real Windows Server runner (Win7 compat via Python 3.8)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"   # last version supporting Windows 7

      - name: Install dependencies
        working-directory: Win
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 requests pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_idm_core.py tests/test_idm_win.py tests/test_speed_core.py tests/test_win_ui.py

      - name: Copy assets
        run: |
          copy "idm-quota-monitor\contents\images\logo.png" "Win\logo.png"

      - name: Build EXE
        working-directory: Win
        run: |
          pyinstaller idm_monitor.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDMQuotaMonitor-Windows
          path: Win/dist/IDMQuotaMonitor.exe
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Win/dist/IDMQuotaMonitor.exe
          generate_release_notes: true

      - name: Move the latest tag to this commit
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Portable Windows build of the newest commit on main.
          files: Win/dist/IDMQuotaMonitor.exe
          make_latest: true
